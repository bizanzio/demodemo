container:
  image: node:22-alpine
  workdir: /app

  # openssl: lo necesita el query engine de Prisma en Alpine (sin él falla en
  # runtime con "Unable to require libquery_engine..."). libc6-compat: mismo
  # motivo que en el resto de proyectos (compatibilidad de paquetes nativos
  # con la libc de Alpine), no se ha necesitado descartarlo.
  uses: [openssl, libc6-compat]

  # No hay "prepare": es una única app en la raíz del repo, sin monorepo que
  # comparta nada — todo el build vive en apps[0].build.

  startup:
    - type: prisma-db-sync
      schema: prisma/schema.prisma
      migrations_dir: prisma/migrations

  apps:
    - name: web
      build:
        - copy: [package.json, package-lock.json]
        # El "APP_SECRET" de 1Password de este proyecto trae una clave
        # "NODE_ENV", y ese valor llega aquí ya puesto vía --build-arg (ver
        # README § "Variables en tiempo de build") ANTES de este primer
        # "run" — o sea, npm YA ve ese NODE_ENV al hacer "npm ci". Los dos
        # pasos siguientes son cortafuegos independientes, reproducidos y
        # confirmados los dos con Docker real, para que el build no dependa
        # de qué valor tenga esa clave en la nota:
        #  - "npm ci" respeta NODE_ENV=production heredado y se salta
        #    devDependencies — pero @tailwindcss/postcss, tailwindcss,
        #    typescript, etc. son devDependencies que este proyecto SÍ
        #    necesita en build (no hay paso de "prune" aparte). Sin
        #    "--include=dev" falla con "Cannot find module
        #    '@tailwindcss/postcss'".
        #  - "next build" con NODE_ENV=development heredado genera bundles
        #    con forma de build de desarrollo y el fallback de "/404"
        #    revienta con "<Html> should not be imported outside of
        #    pages/_document".
        # Arreglo correcto de fondo: quitar esa clave de la nota de
        # 1Password (Next.js ya fija NODE_ENV solo: "next build"/"next
        # start" = production).
        - run: npm ci --include=dev
        - copy: ["."]
        # Genera @prisma/client contra el schema (no toca la BD: eso lo hace
        # "startup" en runtime, contra la BD real de cada entorno).
        - run: npx prisma generate
        - run: NODE_ENV=production npm run build
      run:
        # Ruta relativa a "cwd" (= workdir, /app): npm ci instala en el
        # node_modules de la raíz sin hoisting de monorepo, así que
        # "node_modules/next/dist/bin/next" ya apunta al binario correcto.
        script: node_modules/next/dist/bin/next
        args: start
        interpreter: node
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
      expose:
        port: 3000
        path_prefix: /
        priority: 1
        # "/" pasa por el middleware de next-intl (redirige a /<locale>) y
        # luego la home redirige a /<locale>/survey — varias redirecciones
        # en cadena, pero el wget del HEALTHCHECK las sigue por defecto
        # hasta el 200 final.
        healthcheck: /
