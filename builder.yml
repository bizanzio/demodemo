container:
  image: node:22-alpine
  workdir: /app

  # openssl: lo necesita el query engine de Prisma en Alpine (sin él falla en
  # runtime con "Unable to require libquery_engine..."). libc6-compat: mismo
  # motivo que en el resto de proyectos (compatibilidad de paquetes nativos
  # con la libc de Alpine), no se ha necesitado descartarlo.
  uses: [openssl, libc6-compat]

  # No hay "prepare": es una única app en la raíz del repo, sin monorepo que
  # comparta nada — todo el build vive en apps[0].build.

  startup:
    - type: prisma-db-sync
      schema: prisma/schema.prisma
      migrations_dir: prisma/migrations

  apps:
    - name: web
      build:
        - copy: [package.json, package-lock.json]
        - run: npm ci
        - copy: ["."]
        # El repo NO trae app/not-found.tsx. Sin él, "next build" en limpio
        # (sin caché de .next, que es justo lo que pasa en un build Docker
        # desde cero) revienta al pre-renderizar "/404" con
        # "<Html> should not be imported outside of pages/_document": es el
        # gap que next-intl documenta para peticiones que no matchean
        # [locale] (no hay layout raíz que aporte <html>/<body> para ese
        # caso). Contenido en base64 (ver detalle debajo) para no arrastrar
        # comillas/JSX a través del YAML -> shell -> Dockerfile RUN.
        # Fuente legible del fichero que decodifica esta línea:
        #
        #   import './globals.css';
        #   export default function NotFound() {
        #     return (
        #       <html lang="ca">
        #         <body className="h-full bg-white text-gray-900 antialiased">
        #           <div className="min-h-screen flex items-center justify-center p-4">
        #             <div className="text-center">
        #               <h1 className="text-2xl font-semibold mb-2">404</h1>
        #               <p className="text-gray-500">Page not found</p>
        #             </div>
        #           </div>
        #         </body>
        #       </html>
        #     );
        #   }
        - run: >-
            echo
            
            | base64 -d > app/not-found.tsx
        # Genera @prisma/client contra el schema (no toca la BD: eso lo hace
        # "startup" en runtime, contra la BD real de cada entorno).
        - run: npx prisma generate
        - run: npm run build
      run:
        # Ruta relativa a "cwd" (= workdir, /app): npm ci instala en el
        # node_modules de la raíz sin hoisting de monorepo, así que
        # "node_modules/next/dist/bin/next" ya apunta al binario correcto.
        script: node_modules/next/dist/bin/next
        args: start
        interpreter: node
        env:
          NODE_ENV: production
          PORT: "3000"
          HOSTNAME: "0.0.0.0"
      expose:
        port: 3000
        path_prefix: /
        priority: 1
        # "/" pasa por el middleware de next-intl (redirige a /<locale>) y
        # luego la home redirige a /<locale>/survey — varias redirecciones
        # en cadena, pero el wget del HEALTHCHECK las sigue por defecto
        # hasta el 200 final.
        healthcheck: /
